<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactra demo | Rare Geometry</title>
<style>
  html, body { margin: 0; height: 100%; background: #16181b; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #e9e4dc; }
  #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; background: #16181b; display: block; outline: none; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #16181b; transition: opacity .4s; }
  #loader h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: .5px; }
  #loader p { margin: 0; color: #9a9389; font-size: 14px; }
  #bar { width: 260px; height: 6px; border-radius: 3px; background: #2a2d31; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #d08a4a; transition: width .2s; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px; background: rgba(22,24,27,.82); color: #e9e4dc; font-size: 13px; pointer-events: none; transition: opacity .6s; }
  #err { color: #e07a6a; font-size: 14px; max-width: 420px; text-align: center; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader">
  <h1>Interactra</h1>
  <p>Interactive objects and runtime building for Unity</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="pct">Loading</p>
  <div id="err"></div>
</div>
<div id="hint" style="opacity:0">Click to play. WASD to move, E to use, F1 shows every key.</div>
<script>
  var canvas = document.querySelector("#unity-canvas");
  var config = {
    dataUrl: "Build/build.data.unityweb",
    frameworkUrl: "Build/build.framework.js.unityweb",
    codeUrl: "Build/build.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Rare Geometry",
    productName: "Interactra Demo",
    productVersion: "0.1.0",
  };
  var script = document.createElement("script");
  script.src = "Build/build.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.querySelector("#fill").style.width = Math.round(p * 100) + "%";
      document.querySelector("#pct").textContent = "Loading " + Math.round(p * 100) + "%";
    }).then(function () {
      var l = document.querySelector("#loader");
      l.style.opacity = 0;
      setTimeout(function () { l.remove(); }, 450);
      var h = document.querySelector("#hint");
      h.style.opacity = 1;
      setTimeout(function () { h.style.opacity = 0; }, 9000);
      canvas.focus();
    }).catch(function (m) { document.querySelector("#err").textContent = m; });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
